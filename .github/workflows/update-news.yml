name: Update news and incidents

on:
  schedule:
    # Toutes les 2 h, à la demi-heure pour ne pas croiser le cron des données marché
    - cron: "30 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch news and incidents
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/news.json _data/incidents.json _data/podcast.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des actualités et incidents"
          git pull --rebase
          git push
