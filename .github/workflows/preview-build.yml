name: Aperçu (construction du site sur une branche apercu-*)

# Construit le site avec le même Jekyll que GitHub Pages, sans le publier,
# et met le résultat en téléchargement (artefact « site ») pour le vérifier avant fusion.
on:
  push:
    branches: ["apercu-**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3
