name: Weekly market note

on:
  schedule:
    # Lundi 05:17 UTC (7 h à Paris en été, 6 h en hiver), après le cron des données de minuit.
    # GitHub retarde ou saute parfois les tâches planifiées (19/10/2026 : aucune exécution) : deux rattrapages
    # le même lundi, qui ne font rien si la note de la semaine existe déjà. Minutes hors de l'heure pile (moins chargée).
    - cron: "17 5 * * 1"
    - cron: "47 7 * * 1"
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "Semaine ISO à (re)générer, ex. 2026-W40 (vide = dernière semaine complète)"
        required: false
      force:
        description: "Réécrire une note existante (efface le mot de Tom)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  note:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Note déjà publiée ? (exécutions planifiées de rattrapage)
        id: check
        run: |
          WEEK=$(date -u -d "last sunday" +%G-%V)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "_notes/$WEEK-fr.md" ]; then
            echo "Note $WEEK déjà publiée : rien à faire."; echo "skip=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'yes'
        with:
          python-version: "3.11"

      - name: Generate note
        if: steps.check.outputs.skip != 'yes'
        run: |
          ARGS=""
          if [ -n "${{ inputs.week }}" ]; then ARGS="--week ${{ inputs.week }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/generate_note.py $ARGS

      - name: LinkedIn visuals (Chrome sans interface)
        if: steps.check.outputs.skip != 'yes'
        run: |
          ARGS=""
          if [ -n "${{ inputs.week }}" ]; then ARGS="--week ${{ inputs.week }}"; fi
          python scripts/linkedin_visual.py $ARGS

      - name: Commit note
        if: steps.check.outputs.skip != 'yes'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _notes/ _linkedin/ assets/img/notes/
          if git diff --quiet --cached; then echo "new=" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --cached --name-only -- _notes/ | sed -E 's#_notes/##' > new_notes.txt
          git commit -m "Note de marché hebdomadaire"
          git pull --rebase
          git push
          echo "new=yes" >> "$GITHUB_OUTPUT"

      - name: Publier le site (Cloudflare Pages)
        if: steps.commit.outputs.new == 'yes'
        uses: ./.github/actions/build-deploy
        with:
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: LinkedIn text and visuals in the run summary
        if: steps.commit.outputs.new == 'yes'
        run: |
          f=$(ls -t _linkedin/*.txt | head -1)
          base="${f%.txt}"
          { echo '### Texte LinkedIn prêt à coller'; echo '```'; cat "$f"; echo '```'
            echo '### Visuels (à télécharger aussi dans « Artifacts » en bas de cette page)'
            for png in "$base"-*.png; do
              [ -e "$png" ] && echo "![$(basename "$png")](https://github.com/${{ github.repository }}/raw/main/$png)"
            done; } >> "$GITHUB_STEP_SUMMARY"

      - name: LinkedIn visuals as a downloadable artifact
        if: steps.commit.outputs.new == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: linkedin
          path: |
            _linkedin/*.png
            _linkedin/*.txt

      - name: Notify search engines (IndexNow)
        if: steps.commit.outputs.new == 'yes' && github.ref == 'refs/heads/main'
        run: |
          # Laisse le temps à la publication d'être en ligne partout
          sleep 30
          # Adresses des notes qui viennent d'être créées, plus les deux pages d'archive
          URLS=$(while read f; do grep -h '^permalink:' "_notes/$f"; done < new_notes.txt \
            | sed -E 's#permalink: "([^"]+)"#https://insideenergymarkets.com\1#' | jq -R . \
            | jq -s '. + ["https://insideenergymarkets.com/analyses/", "https://insideenergymarkets.com/en/analysis/"]')
          curl -s -o /dev/null -w "IndexNow : %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"insideenergymarkets.com\",\"key\":\"ba5fdc11ee8578d5540c332e9933f73f\",\"keyLocation\":\"https://insideenergymarkets.com/ba5fdc11ee8578d5540c332e9933f73f.txt\",\"urlList\":$URLS}"
