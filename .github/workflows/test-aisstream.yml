name: Test AISStream (couverture détroits)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Durée d'écoute en secondes"
        default: "600"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install websockets
      - name: Écoute AISStream
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AIS_DURATION: ${{ inputs.duration }}
        run: python scripts/test_aisstream.py
