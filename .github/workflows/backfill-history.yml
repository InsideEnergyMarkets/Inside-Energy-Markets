name: Backfill History (one-time)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run backfill
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          RTE_BASE64_KEY: ${{ secrets.RTE_BASE64_KEY }}
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: python scripts/backfill_history.py
      - name: Commit result
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/market_history.json
          if git diff --quiet --cached; then echo "changed=" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Backfill historique Brent, Henry Hub, Spot FR"
          git pull --rebase
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: Publier le site (Cloudflare Pages)
        if: steps.commit.outputs.changed == 'yes'
        uses: ./.github/actions/build-deploy
        with:
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
