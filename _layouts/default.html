<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ '/assets/img/hero.png' | relative_url }}">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
  <script>
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.btn-listen');

  document.querySelectorAll('.listen-dropdown.open').forEach(function (d) {
    if (!btn || d !== btn.nextElementSibling) d.classList.remove('open');
  });
  document.querySelectorAll('.btn-listen[aria-expanded="true"]').forEach(function (b) {
    if (b !== btn) b.setAttribute('aria-expanded', 'false');
  });

  if (btn) {
    var dropdown = btn.nextElementSibling;
    var isOpen = dropdown.classList.toggle('open');
    btn.setAttribute('aria-expanded', isOpen);
    e.stopPropagation();
  }
});
</script>
<body>
  <nav class="site-nav">
    <div class="wrap">
      <a href="{{ '/' | relative_url }}" class="brand-logo">
        <img src="{{ '/assets/img/hero.png' | relative_url }}" alt="Inside Energy Markets">
      </a>
      <ul class="nav-links">
        <li><a href="{{ '/episodes/' | relative_url }}">Épisodes</a></li>
        <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
        <li><a href="{{ '/about/' | relative_url }}">À propos</a></li>
      </ul>
    </div>
  </nav>

  {{ content }}

  <footer>

      </div>
