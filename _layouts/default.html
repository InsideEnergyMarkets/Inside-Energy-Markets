<script>
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.btn-listen');

  document.querySelectorAll('.listen-dropdown.open').forEach(function (d) {
    if (!btn || d !== btn.nextElementSibling) d.classList.remove('open');
  });
  document.querySelectorAll('.btn-listen[aria-expanded="true"]').forEach(function (b) {
    if (b !== btn) b.setAttribute('aria-expanded', 'false');
  });
  document.querySelectorAll('.card.dropdown-active').forEach(function (c) {
    if (!btn || c !== btn.closest('.card')) c.classList.remove('dropdown-active');
  });

  if (btn) {
    var dropdown = btn.nextElementSibling;
    var isOpen = dropdown.classList.toggle('open');
    btn.setAttribute('aria-expanded', isOpen);
    var card = btn.closest('.card');
    if (card) card.classList.toggle('dropdown-active', isOpen);
    e.stopPropagation();
  }
});
</script>

  <script>
// Fallback générique pour toutes les cartes AIS (Ormuz, Bab-el-Mandeb, Malacca...)
// Le délai ne démarre que quand la carte est visible à l'écran : avec loading="lazy",
// le navigateur ne charge l'iframe qu'à l'approche de la carte, et un délai lancé dès
// l'ouverture de la page expirait avant même le début du chargement (surtout sur mobile).
// La carte n'est jamais cachée : le message passe par-dessus et disparaît si elle
// finit par se charger.
var AIS_TIMEOUT_MS = 20000;
document.querySelectorAll('.ais-embed-wrap').forEach(function (wrap) {
  var frame = wrap.querySelector('.ais-frame');
  var fallback = wrap.querySelector('.ais-fallback');
  if (!frame || !fallback) return;
  var loaded = false, timer = null;

  function startTimer() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (!loaded) fallback.style.display = 'flex';
    }, AIS_TIMEOUT_MS);
  }

  // Carte repliée (data-src) : on ne la charge qu'à l'ouverture du volet
  var details = wrap.closest('details');
  if (details && frame.dataset.src) {
    details.addEventListener('toggle', function () {
      if (details.open && !frame.getAttribute('src')) frame.src = frame.dataset.src;
    });
  }

  frame.addEventListener('load', function () {
    // Une iframe sans src déclenche aussi « load » (page vide) : on l'ignore
    if (!frame.getAttribute('src')) return;
    loaded = true;
    clearTimeout(timer);
    fallback.style.display = 'none';
  });

  var retry = document.createElement('button');
  retry.type = 'button';
  retry.className = 'ais-retry';
  retry.textContent = 'Réessayer';
  retry.addEventListener('click', function () {
    loaded = false;
    fallback.style.display = 'none';
    frame.src = frame.src;
    startTimer();
  });
  fallback.insertBefore(retry, fallback.querySelector('a'));

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) {
        observer.disconnect();
        if (!loaded) startTimer();
      }
    });
    observer.observe(wrap);
  } else {
    startTimer();
  }
});

// Onglets de la page /marches/
document.querySelectorAll('.mkt-tab-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var target = btn.getAttribute('data-tab');

    document.querySelectorAll('.mkt-tab-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    btn.classList.add('active');

    document.querySelectorAll('.mkt-panel').forEach(function (panel) {
      panel.classList.remove('active');
    });
    var targetPanel = document.getElementById('panel-' + target);
    if (targetPanel) targetPanel.classList.add('active');
  });
});
</script>

<script>
(function () {
  var chartInstances = {};
  var cardDays = {};

  // Ne garde que les points renseignés de la série, sur les N derniers jours
  // avant son dernier point, pour que la courbe occupe toute la largeur
  function seriesWindow(dataset, days) {
    var labels = [], values = [], sources = [];
    (dataset.labels || []).forEach(function (d, i) {
      var v = dataset.values && dataset.values[i];
      if (v !== null && v !== undefined) {
        labels.push(d);
        values.push(v);
        sources.push((dataset.sources && dataset.sources[i]) || null);
      }
    });
    if (!labels.length) return { labels: labels, values: values, sources: sources };
    var cutoff = parseDay(labels[labels.length - 1]);
    cutoff.setDate(cutoff.getDate() - days);
    var start = 0;
    while (start < labels.length - 1 && parseDay(labels[start]) <= cutoff) start++;
    return { labels: labels.slice(start), values: values.slice(start), sources: sources.slice(start) };
  }

  function parseDay(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function fmtNum(v) {
    return v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtDay(s) {
    return parseDay(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  }

  // Moyenne des points des 7 derniers jours calendaires (jour inclus), calculée
  // sur toute la série pour que le début de la période ait déjà une moyenne
  function movingAverage(dataset, labels) {
    var all = seriesWindow(dataset, 100000), byDay = {};
    all.labels.forEach(function (d, i) {
      var from = parseDay(d);
      from.setDate(from.getDate() - 6);
      var sum = 0, n = 0;
      for (var j = i; j >= 0 && parseDay(all.labels[j]) >= from; j--) { sum += all.values[j]; n++; }
      byDay[d] = Math.round(sum / n * 100) / 100;
    });
    return labels.map(function (d) { return byDay[d]; });
  }

  // Ligne verticale qui suit la souris
  var crosshair = {
    id: 'mktCrosshair',
    afterDatasetsDraw: function (chart) {
      var active = chart.tooltip && chart.tooltip.getActiveElements();
      if (!active || !active.length) return;
      var x = active[0].element.x, area = chart.chartArea, ctx = chart.ctx;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x, area.top);
      ctx.lineTo(x, area.bottom);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.stroke();
      ctx.restore();
    }
  };

  function chartConfig(dataset, win, opts) {
    opts = opts || {};
    var datasets = [{
      data: win.values,
      borderColor: dataset.color,
      backgroundColor: dataset.color + '22',
      fill: true,
      tension: 0.25,
      spanGaps: true,
      pointRadius: 0,
      pointHoverRadius: opts.large ? 4 : 0,
      borderWidth: opts.large ? 2.5 : 2,
    }];
    if (opts.ma) {
      datasets.push({
        data: opts.ma,
        borderColor: 'rgba(255,255,255,0.7)',
        borderDash: [5, 4],
        borderWidth: 1.5,
        fill: false,
        tension: 0.25,
        pointRadius: 0,
        pointHoverRadius: 0,
      });
    }
    var tickColor = 'rgba(255,255,255,0.5)';
    return {
      type: 'line',
      data: { labels: win.labels, datasets: datasets },
      plugins: opts.large ? [crosshair] : [],
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            displayColors: false,
            callbacks: {
              title: function (items) { return items.length ? fmtDay(items[0].label) : ''; },
              label: function (ctx) {
                var txt = fmtNum(ctx.parsed.y) + ' ' + (dataset.unit || '');
                return ctx.datasetIndex === 1 ? 'Moy. 7j : ' + txt : txt;
              },
              afterBody: function (items) {
                var src = items.length && (win.sources[items[0].dataIndex] || dataset.source);
                return src ? 'Source : ' + src : '';
              }
            }
          }
        },
        scales: {
          x: opts.large
            ? { ticks: { color: tickColor, font: { size: 11 }, maxTicksLimit: 8, maxRotation: 0,
                         callback: function (v) { return fmtDay(this.getLabelForValue(v)); } },
                grid: { display: false } }
            : { display: false },
          y: { ticks: { color: tickColor, font: { size: opts.large ? 11 : 9 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
        }
      }
    };
  }

  function renderChart(key, days) {
    var dataset = window.mktChartData && window.mktChartData[key];
    if (!dataset) return;
    var canvas = document.getElementById('chart-canvas-' + key);
    if (!canvas || typeof Chart === 'undefined') return;
    cardDays[key] = days;
    if (chartInstances[key]) chartInstances[key].destroy();
    chartInstances[key] = new Chart(canvas.getContext('2d'), chartConfig(dataset, seriesWindow(dataset, days)));
  }

  // ===== Vue agrandie =====
  var modal = null, modalChart = null, modalState = {};

  function buildModal() {
    modal = document.createElement('div');
    modal.className = 'mkt-modal';
    modal.hidden = true;
    modal.innerHTML =
      '<div class="mkt-modal-box" role="dialog" aria-modal="true" aria-labelledby="mkt-modal-title">' +
        '<div class="mkt-modal-head">' +
          '<h3 id="mkt-modal-title" class="mkt-commodity-name"></h3>' +
          '<div class="mkt-modal-tools">' +
            '<button type="button" class="period-btn mkt-compare-btn" aria-pressed="false">Comparer (base 100)</button>' +
            '<button type="button" class="period-btn mkt-ma-btn" aria-pressed="false">Moy. mobile 7j</button>' +
            '<div class="mkt-period-btns">' +
              '<button type="button" class="period-btn" data-period="7">7j</button>' +
              '<button type="button" class="period-btn" data-period="30">30j</button>' +
              '<button type="button" class="period-btn" data-period="60">60j</button>' +
            '</div>' +
            '<button type="button" class="mkt-modal-close" aria-label="Fermer">&#x2715;</button>' +
          '</div>' +
        '</div>' +
        '<div class="mkt-modal-chart"><canvas id="mkt-modal-canvas"></canvas></div>' +
        '<div class="mkt-modal-stats"></div>' +
      '</div>';
    document.body.appendChild(modal);

    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    modal.querySelector('.mkt-modal-close').addEventListener('click', closeModal);
    modal.querySelectorAll('[data-period]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        modalState.days = parseInt(btn.getAttribute('data-period'), 10);
        renderModal();
      });
    });
    modal.querySelector('.mkt-ma-btn').addEventListener('click', function () {
      modalState.ma = !modalState.ma;
      renderModal();
    });
    modal.querySelector('.mkt-compare-btn').addEventListener('click', function () {
      modalState.compare = !modalState.compare;
      renderModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !modal.hidden) closeModal();
    });
  }

  function stat(label, value, unit, extra, cls) {
    return '<div class="mkt-modal-stat"><span class="mkt-weekly-label">' + label + '</span>' +
      '<span class="mkt-weekly-value' + (cls ? ' ' + cls : '') + '">' + value +
      (unit ? ' <small>' + unit + '</small>' : '') + '</span>' +
      (extra ? '<span class="mkt-modal-stat-sub">' + extra + '</span>' : '') + '</div>';
  }

  function renderStats(dataset, win) {
    var box = modal.querySelector('.mkt-modal-stats');
    var v = win.values, n = v.length, unit = dataset.unit || '';
    if (!n) { box.innerHTML = ''; return; }
    var iMin = 0, iMax = 0, sum = 0;
    v.forEach(function (x, i) { if (x < v[iMin]) iMin = i; if (x > v[iMax]) iMax = i; sum += x; });
    var diff = v[n - 1] - v[0];
    var pct = v[0] ? diff / Math.abs(v[0]) * 100 : 0;
    var sign = diff > 0 ? '+' : '';
    box.innerHTML =
      stat('Dernier', fmtNum(v[n - 1]), unit,
           fmtDay(win.labels[n - 1]) + (win.sources[n - 1] ? ' · ' + win.sources[n - 1] : '')) +
      stat('Variation', sign + fmtNum(pct), '%',
           sign + fmtNum(diff) + ' ' + unit + ' depuis le ' + fmtDay(win.labels[0]),
           diff > 0 ? 'up' : (diff < 0 ? 'down' : '')) +
      stat('Plus bas', fmtNum(v[iMin]), unit, fmtDay(win.labels[iMin])) +
      stat('Plus haut', fmtNum(v[iMax]), unit, fmtDay(win.labels[iMax])) +
      stat('Moyenne', fmtNum(sum / n), unit, n + ' jours de données');
  }

  // ===== Comparaison base 100 =====
  // Chaque série est divisée par sa première valeur de la période (x 100) :
  // 110 = +10 % depuis le début de la période, quelle que soit l'unité
  var seriesNames = { spot: 'Électricité FR', brent: 'Brent', henryhub: 'Henry Hub', ttf: 'TTF' };

  // Ligne pointillée au niveau 100
  var baseLine = {
    id: 'mktBaseLine',
    afterDatasetsDraw: function (chart) {
      var y = chart.scales.y.getPixelForValue(100), area = chart.chartArea, ctx = chart.ctx;
      if (y < area.top || y > area.bottom) return;
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(area.left, y);
      ctx.lineTo(area.right, y);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.stroke();
      ctx.restore();
    }
  };

  function compareSeries(days) {
    var keys = Object.keys(window.mktChartData);
    var wins = {}, latest = null;
    keys.forEach(function (k) {
      wins[k] = seriesWindow(window.mktChartData[k], 100000);
      var last = wins[k].labels[wins[k].labels.length - 1];
      if (last && (!latest || last > latest)) latest = last;
    });
    // Même période calendaire pour toutes les séries, calée sur la date la plus récente
    var cutoff = parseDay(latest);
    cutoff.setDate(cutoff.getDate() - days);
    var dates = {};
    var series = keys.map(function (k) {
      // On compare les moyennes mobiles 7 jours : sinon le résultat dépend
      // surtout du jour de départ (un creux ou un pic isolé du spot, par ex.)
      var w = wins[k], ma = movingAverage(window.mktChartData[k], w.labels);
      var byDay = {}, first = null, lastDay = null;
      w.labels.forEach(function (d, i) {
        if (parseDay(d) <= cutoff) return;
        if (first === null) first = i;
        lastDay = i;
        byDay[d] = { raw: w.values[i], index: ma[i] / ma[first] * 100 };
        dates[d] = true;
      });
      return {
        key: k, byDay: byDay, dataset: window.mktChartData[k],
        name: seriesNames[k] || k,
        start: first === null ? null : { day: w.labels[first], value: ma[first] },
        end: lastDay === null ? null : { day: w.labels[lastDay], value: ma[lastDay] }
      };
    }).filter(function (s) { return s.start; });
    return { labels: Object.keys(dates).sort(), series: series };
  }

  function compareConfig(cmp, focusKey) {
    var tickColor = 'rgba(255,255,255,0.5)';
    return {
      type: 'line',
      data: {
        labels: cmp.labels,
        datasets: cmp.series.map(function (s) {
          var focus = s.key === focusKey;
          return {
            label: s.name,
            data: cmp.labels.map(function (d) { return s.byDay[d] ? Math.round(s.byDay[d].index * 10) / 10 : null; }),
            borderColor: s.dataset.color,
            backgroundColor: s.dataset.color,
            borderWidth: focus ? 3 : 1.8,
            tension: 0.25,
            spanGaps: true,
            fill: false,
            pointRadius: 0,
            pointHoverRadius: 4,
            order: focus ? 0 : 1,
          };
        })
      },
      plugins: [crosshair, baseLine],
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            display: true,
            position: 'top',
            align: 'start',
            labels: { color: '#e2e8f5', usePointStyle: true, pointStyle: 'line', boxWidth: 24, font: { size: 12 } }
          },
          tooltip: {
            callbacks: {
              title: function (items) { return items.length ? fmtDay(items[0].label) : ''; },
              label: function (ctx) {
                var s = cmp.series[ctx.datasetIndex], p = s.byDay[ctx.label];
                if (!p) return s.name + ' : pas de cotation';
                return s.name + ' : ' + ctx.parsed.y.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) +
                  ' (' + fmtNum(p.raw) + ' ' + (s.dataset.unit || '') + ')';
              }
            }
          }
        },
        scales: {
          x: { ticks: { color: tickColor, font: { size: 11 }, maxTicksLimit: 8, maxRotation: 0,
                        callback: function (v) { return fmtDay(this.getLabelForValue(v)); } },
               grid: { display: false } },
          y: { ticks: { color: tickColor, font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
        }
      }
    };
  }

  function renderCompareStats(cmp) {
    var ranked = cmp.series.map(function (s) {
      return { s: s, pct: (s.end.value / s.start.value - 1) * 100 };
    }).sort(function (a, b) { return b.pct - a.pct; });
    modal.querySelector('.mkt-modal-stats').innerHTML = ranked.map(function (r, i) {
      var sign = r.pct > 0 ? '+' : '', unit = r.s.dataset.unit || '';
      return stat((i + 1) + '. ' + r.s.name, sign + fmtNum(r.pct), '%',
        'Moy. 7j : ' + fmtNum(r.s.start.value) + ' → ' + fmtNum(r.s.end.value) + ' ' + unit +
        '<br>du ' + fmtDay(r.s.start.day) + ' au ' + fmtDay(r.s.end.day),
        r.pct > 0 ? 'up' : (r.pct < 0 ? 'down' : ''));
    }).join('') +
    '<p class="mkt-modal-note">Courbes lissées sur 7 jours, ramenées à 100 au début de la période : ' +
    'une courbe à 110 a pris 10 %. Le lissage évite qu\'un seul jour de départ (un creux ou un pic) ' +
    'fausse la comparaison. L\'infobulle donne le prix réel du jour.</p>';
  }

  function renderModal() {
    var dataset = window.mktChartData[modalState.key];
    var win = seriesWindow(dataset, modalState.days);
    modal.querySelectorAll('[data-period]').forEach(function (b) {
      b.classList.toggle('active', parseInt(b.getAttribute('data-period'), 10) === modalState.days);
    });
    var maBtn = modal.querySelector('.mkt-ma-btn');
    maBtn.classList.toggle('active', !!modalState.ma);
    maBtn.setAttribute('aria-pressed', modalState.ma ? 'true' : 'false');
    maBtn.hidden = !!modalState.compare;
    var cmpBtn = modal.querySelector('.mkt-compare-btn');
    cmpBtn.classList.toggle('active', !!modalState.compare);
    cmpBtn.setAttribute('aria-pressed', modalState.compare ? 'true' : 'false');
    modal.querySelector('#mkt-modal-title').textContent =
      modalState.compare ? 'Comparaison base 100' : modalState.title;

    if (modalChart) modalChart.destroy();
    var ctx = document.getElementById('mkt-modal-canvas').getContext('2d');
    if (modalState.compare) {
      var cmp = compareSeries(modalState.days);
      modalChart = new Chart(ctx, compareConfig(cmp, modalState.key));
      renderCompareStats(cmp);
      return;
    }
    modalChart = new Chart(ctx,
      chartConfig(dataset, win, { large: true, ma: modalState.ma ? movingAverage(dataset, win.labels) : null }));
    renderStats(dataset, win);
  }

  function openModal(key, title, trigger) {
    if (!window.mktChartData || !window.mktChartData[key] || typeof Chart === 'undefined') return;
    if (!modal) buildModal();
    modalState = { key: key, days: cardDays[key] || 30, ma: false, compare: false, title: title, trigger: trigger };
    modal.querySelector('.mkt-modal-box').style.borderTopColor = window.mktChartData[key].color;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    renderModal();
    modal.querySelector('.mkt-modal-close').focus();
  }

  function closeModal() {
    modal.hidden = true;
    document.body.style.overflow = '';
    if (modalChart) { modalChart.destroy(); modalChart = null; }
    if (modalState.trigger) modalState.trigger.focus();
  }

  // Accès depuis les blocs où le graphique est toujours visible (ex. Électricité France)
  window.mktCharts = { render: renderChart, open: openModal, window: seriesWindow };

  document.querySelectorAll('.mkt-flip-outer').forEach(function (card) {
    var key = card.getAttribute('data-chart');
    var nameEl = card.querySelector('.mkt-commodity-name--sm');
    if (nameEl) seriesNames[key] = nameEl.textContent.trim();

    // Bouton d'agrandissement ajouté à côté des boutons de période
    var btns = card.querySelector('.mkt-flip-back .mkt-period-btns');
    if (btns) {
      var expand = document.createElement('button');
      expand.type = 'button';
      expand.className = 'period-btn mkt-expand-btn';
      expand.setAttribute('aria-label', 'Agrandir le graphique');
      expand.title = 'Agrandir';
      expand.innerHTML = '&#x2922;';
      expand.addEventListener('click', function (e) {
        e.stopPropagation();
        openModal(key, nameEl ? nameEl.textContent : '', expand);
      });
      btns.appendChild(expand);
    }

    card.addEventListener('click', function (e) {
      if (e.target.closest('.period-btn')) return;
      card.classList.toggle('flipped');
      if (card.classList.contains('flipped') && !chartInstances[key]) {
        renderChart(key, 30);
      }
    });

    card.querySelectorAll('.period-btn[data-period]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        card.querySelectorAll('.period-btn[data-period]').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderChart(key, parseInt(btn.getAttribute('data-period'), 10));
      });
    });
  });
})();
</script>
<script>
// ===== Détroits : courbe 90 jours et graphique Ormuz / Brent =====
(function () {
  if (typeof Chart === 'undefined') return;
  var TICK = 'rgba(255,255,255,0.5)', GRID = 'rgba(255,255,255,0.06)';

  function day(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  }
  function fmt(v, d) { return v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  // Moyenne mobile sur 7 points (PortWatch publie un point par jour, week-ends compris)
  function ma7(values) {
    return values.map(function (_, i) {
      var s = values.slice(Math.max(0, i - 6), i + 1).filter(function (v) { return v !== null; });
      return s.length ? s.reduce(function (a, b) { return a + b; }, 0) / s.length : null;
    });
  }
  function xAxis(limit) {
    return { ticks: { color: TICK, maxTicksLimit: limit, maxRotation: 0,
                      callback: function (v) { return day(this.getLabelForValue(v)); } },
             grid: { display: false } };
  }

  var history = window.mktChokepoints || {};

  document.querySelectorAll('canvas[data-cp-chart]').forEach(function (canvas) {
    var rows = history[canvas.getAttribute('data-cp-chart')];
    if (!rows || !rows.length) return;
    var ref = parseFloat(canvas.getAttribute('data-ref'));
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: rows.map(function (r) { return r.date; }),
        datasets: [
          { data: ma7(rows.map(function (r) { return r.n_tanker; })), borderColor: '#e8703a', backgroundColor: '#e8703a22',
            fill: true, tension: 0.25, pointRadius: 0, pointHoverRadius: 3, borderWidth: 2 },
          { data: rows.map(function () { return ref; }), borderColor: 'rgba(255,255,255,0.6)', borderDash: [5, 4],
            pointRadius: 0, pointHoverRadius: 0, borderWidth: 1.5 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: {
          title: function (items) { return day(items[0].label); },
          label: function (c) { return (c.datasetIndex ? 'Normale : ' : 'Tankers/jour (moy. 7 j) : ') + fmt(c.parsed.y, 1); },
          afterBody: function () { return 'Source : IMF PortWatch'; } } } },
        scales: { x: xAxis(6), y: { beginAtZero: true, ticks: { color: TICK }, grid: { color: GRID } } }
      }
    });
  });

  var cmp = document.getElementById('mt-brent-cmp');
  var year = history.hormuz_year;
  if (cmp && year && year.length) {
    var refCap = parseFloat(cmp.getAttribute('data-ref')) * 1e6;
    var capMa = ma7(year.map(function (r) { return r.capacity_tanker; }));
    var capByDay = {};
    year.forEach(function (r, i) { capByDay[r.date] = capMa[i] === null ? null : Math.round(capMa[i] / refCap * 1000) / 10; });

    // Brent : clôtures EIA sur 12 mois, complétées par les derniers cours du site (OilPriceAPI)
    var brent = {}, lastEia = '';
    (window.mktBrentYear || []).forEach(function (b) { brent[b.date] = b.v; if (b.date > lastEia) lastEia = b.date; });
    var recent = window.mktChartData && window.mktChartData.brent;
    if (recent) recent.labels.forEach(function (d, i) {
      if (d > lastEia && recent.values[i] !== null && recent.values[i] !== undefined) brent[d] = recent.values[i];
    });

    var start = year[0].date, dates = {};
    year.forEach(function (r) { dates[r.date] = 1; });
    Object.keys(brent).forEach(function (d) { if (d >= start) dates[d] = 1; });
    var labels = Object.keys(dates).sort();

    new Chart(cmp, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { data: labels.map(function (d) { return d in capByDay ? capByDay[d] : null; }), yAxisID: 'y',
            borderColor: '#4fd1c5', tension: 0.25, pointRadius: 0, pointHoverRadius: 3, borderWidth: 2, spanGaps: true },
          { data: labels.map(function (d) { return d in brent ? brent[d] : null; }), yAxisID: 'y1',
            borderColor: '#e8703a', tension: 0.25, pointRadius: 0, pointHoverRadius: 3, borderWidth: 2, spanGaps: true }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { callbacks: {
          title: function (items) { return day(items[0].label); },
          label: function (c) {
            return c.datasetIndex ? 'Brent : ' + fmt(c.parsed.y, 2) + ' $/baril'
                                  : 'Capacité tankers Ormuz : ' + fmt(c.parsed.y, 0) + ' % de la normale';
          } } } },
        scales: {
          x: xAxis(7),
          y: { position: 'left', min: 0, max: 120, grid: { color: GRID },
               ticks: { color: '#4fd1c5', callback: function (v) { return v + ' %'; } } },
          y1: { position: 'right', grid: { display: false },
                ticks: { color: '#e8703a', callback: function (v) { return v + ' $'; } } }
        }
      }
    });
  }
})();
</script>
<script>
// ===== Bandeau d'actualités : ancienneté de chaque titre, calculée à l'affichage =====
document.querySelectorAll('.nw-time[data-date]').forEach(function (el) {
  var min = Math.round((Date.now() - new Date(el.getAttribute('data-date'))) / 60000);
  if (isNaN(min)) return;
  el.textContent = min < 60 ? 'il y a ' + Math.max(min, 1) + ' min'
    : min < 1440 ? 'il y a ' + Math.round(min / 60) + ' h'
    : 'il y a ' + Math.round(min / 1440) + ' j';
});

// ===== Bandeau d'actualités : un titre à la fois, le suivant arrive par le bas =====
document.querySelectorAll('.nw-bar').forEach(function (bar) {
  var slides = bar.querySelectorAll('.nw-slide'), count = bar.querySelector('.nw-count');
  if (slides.length < 2) return;
  var current = 0, paused = false;
  slides.forEach(function (s, i) { if (i) s.querySelector('a').setAttribute('tabindex', '-1'); });
  function next() {
    if (paused || document.hidden) return;
    var leaving = slides[current];
    current = (current + 1) % slides.length;
    leaving.classList.remove('is-active');
    leaving.classList.add('is-leaving');
    leaving.querySelector('a').setAttribute('tabindex', '-1');
    slides[current].classList.add('is-active');
    slides[current].querySelector('a').removeAttribute('tabindex');
    setTimeout(function () { leaving.classList.remove('is-leaving'); }, 650);
    if (count) count.textContent = (current + 1) + '/' + slides.length;
  }
  bar.addEventListener('mouseenter', function () { paused = true; });
  bar.addEventListener('mouseleave', function () { paused = false; });
  bar.addEventListener('focusin', function () { paused = true; });
  bar.addEventListener('focusout', function () { paused = false; });
  setInterval(next, 6000);
});

// ===== Exportations de GNL des États-Unis (EIA, mensuel) =====
(function () {
  var canvas = document.getElementById('lng-chart');
  if (!canvas || typeof Chart === 'undefined' || !window.mktLng) return;
  var rows = window.mktLng;
  function month(m, long) {
    var p = m.split('-');
    return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('fr-FR', { month: long ? 'long' : 'short', year: long ? 'numeric' : '2-digit' });
  }
  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: rows.map(function (r) { return r.month; }),
      datasets: [{ data: rows.map(function (r) { return r.bcfd; }), backgroundColor: '#e8b33a', borderRadius: 3 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: {
        title: function (items) { return month(items[0].label, true); },
        label: function (c) { return c.parsed.y.toLocaleString('fr-FR') + ' Bcf/j'; },
        afterBody: function () { return 'Source : EIA'; } } } },
      scales: {
        x: { ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 11 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 9,
                      callback: function (v) { return month(this.getLabelForValue(v)); } }, grid: { display: false } },
        y: { beginAtZero: true, ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
      }
    }
  });
})();

// ===== Gaz : les trois prix de référence en €/MWh =====
// $/MMBtu -> €/MWh : 1 MMBtu = 0,293071 MWh, taux euro-dollar BCE du jour (ou le dernier connu)
(function () {
  var gas = window.mktGas;
  if (!gas || !gas.ttf) return;
  var MWH_PER_MMBTU = 0.293071;
  var fx = gas.eurusd || [];
  function rateAt(day) {
    var r = null;
    for (var i = 0; i < fx.length && fx[i].date <= day; i++) r = fx[i].v;
    return r || (fx.length ? fx[0].v : null);
  }
  function toEurMwh(v, day, usd) { return usd ? v / rateAt(day) / MWH_PER_MMBTU : v; }
  function fmt(v) { return v.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }

  // Équivalent en €/MWh et écart avec le TTF sous chaque prix
  var ttfNow = gas.ttf[gas.ttf.length - 1].v, lastFx = fx.length ? fx[fx.length - 1] : null;
  document.querySelectorAll('.gz-row[data-conv]').forEach(function (row) {
    var v = parseFloat(row.getAttribute('data-conv')), out = row.querySelector('[data-conv-out]');
    if (isNaN(v) || !out) return;
    var usd = row.getAttribute('data-unit').indexOf('$') === 0;
    if (usd && !lastFx) return;
    var eur = usd ? v / lastFx.v / MWH_PER_MMBTU : v, gap = eur - ttfNow;
    out.textContent = (usd ? '≈ ' + fmt(eur) + ' €/MWh, ' : '') +
      (gap >= 0 ? '+' : '') + fmt(gap) + ' €/MWh vs TTF · ';
  });

  var canvas = document.getElementById('gz-cmp');
  if (!canvas || typeof Chart === 'undefined') return;
  var SERIES = [
    { key: 'ttf', name: 'TTF', color: '#4fd1c5', usd: false },
    { key: 'jkm', name: 'JKM', color: '#f472b6', usd: true },
    { key: 'hh', name: 'Henry Hub', color: '#e8b33a', usd: true }
  ];
  function day(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  }
  var chart = null;
  function render(days) {
    var last = gas.ttf[gas.ttf.length - 1].date, from = new Date(last);
    from.setDate(from.getDate() - days);
    var start = from.toISOString().slice(0, 10), dates = {};
    SERIES.forEach(function (s) { (gas[s.key] || []).forEach(function (p) { if (p.date >= start) dates[p.date] = 1; }); });
    var labels = Object.keys(dates).sort();
    var datasets = SERIES.map(function (s) {
      var by = {};
      (gas[s.key] || []).forEach(function (p) { by[p.date] = Math.round(toEurMwh(p.v, p.date, s.usd) * 10) / 10; });
      return { label: s.name, data: labels.map(function (d) { return d in by ? by[d] : null; }), borderColor: s.color,
               backgroundColor: s.color, borderWidth: s.key === 'ttf' ? 2.5 : 1.6, pointRadius: 0, pointHoverRadius: 3,
               tension: 0.25, spanGaps: true };
    });
    if (chart) chart.destroy();
    chart = new Chart(canvas, {
      type: 'line', data: { labels: labels, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { callbacks: {
          title: function (items) { return day(items[0].label); },
          label: function (c) { return c.parsed.y === null ? null : c.dataset.label + ' : ' + fmt(c.parsed.y) + ' €/MWh'; },
          afterBody: function () { return 'Source : OilPriceAPI, taux BCE'; } } } },
        scales: {
          x: { ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 }, maxTicksLimit: 6, maxRotation: 0,
                        callback: function (v) { return day(this.getLabelForValue(v)); } }, grid: { display: false } },
          y: { ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
        }
      }
    });
  }
  render(90);
  var btns = document.querySelectorAll('#gz-cmp-btns [data-period]');
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      btns.forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      render(parseInt(b.getAttribute('data-period'), 10));
    });
  });
})();

// ===== Graphiques toujours visibles (bloc Électricité) : périodes et agrandissement =====
(function () {
  if (!window.mktCharts) return;
  document.querySelectorAll('[data-chart-controls]').forEach(function (box) {
    var key = box.getAttribute('data-chart-controls');
    var active = box.querySelector('.period-btn.active');
    window.mktCharts.render(key, active ? parseInt(active.getAttribute('data-period'), 10) : 30);
    box.querySelectorAll('[data-period]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        box.querySelectorAll('[data-period]').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        window.mktCharts.render(key, parseInt(btn.getAttribute('data-period'), 10));
      });
    });
  });
  document.querySelectorAll('[data-expand]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      window.mktCharts.open(btn.getAttribute('data-expand'), btn.getAttribute('data-title'), btn);
    });
  });

  // Moyenne, plus bas et plus haut des 7 derniers jours cotés (Brent, Henry Hub)
  document.querySelectorAll('[data-week-stats]').forEach(function (box) {
    var dataset = window.mktChartData && window.mktChartData[box.getAttribute('data-week-stats')];
    if (!dataset) return;
    var v = window.mktCharts.window(dataset, 7).values;
    if (!v.length) return;
    function put(k, x) {
      box.querySelector('[data-stat="' + k + '"]').textContent =
        x.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + dataset.unit.split('/')[0];
    }
    put('avg', v.reduce(function (a, b) { return a + b; }, 0) / v.length);
    put('min', Math.min.apply(null, v));
    put('max', Math.max.apply(null, v));
  });
})();

// ===== Fenêtres de détail (détroits, Ormuz / Brent) =====
(function () {
  document.querySelectorAll('[data-dialog]').forEach(function (btn) {
    var dlg = document.getElementById(btn.getAttribute('data-dialog'));
    if (!dlg || typeof dlg.showModal !== 'function') return;
    btn.addEventListener('click', function () {
      dlg.showModal();
      document.body.style.overflow = 'hidden';
      // Graphiques créés quand la fenêtre était fermée : on les recale sur leur taille réelle
      if (window.Chart) dlg.querySelectorAll('canvas').forEach(function (c) {
        var ch = Chart.getChart(c);
        if (ch) ch.resize();
      });
    });
  });
  document.querySelectorAll('.mk-dialog').forEach(function (dlg) {
    dlg.addEventListener('close', function () { document.body.style.overflow = ''; });
    dlg.addEventListener('click', function (e) {
      // Clic sur le fond assombri (hors de la fenêtre) ou sur la croix
      var r = dlg.getBoundingClientRect();
      var outside = e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
      if ((e.target === dlg && outside) || e.target.closest('[data-close]')) dlg.close();
    });
  });
})();

// ===== Sommaire de la page Marchés : rubrique en cours de lecture =====
(function () {
  var links = document.querySelectorAll('.mk-toc a[href^="#"]');
  if (!links.length || !('IntersectionObserver' in window)) return;
  var byId = {};
  links.forEach(function (a) { byId[a.getAttribute('href').slice(1)] = a; });
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      links.forEach(function (a) { a.classList.remove('is-current'); });
      var a = byId[e.target.id];
      if (a) {
        a.classList.add('is-current');
        a.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  Object.keys(byId).forEach(function (id) {
    var section = document.getElementById(id);
    if (section) observer.observe(section);
  });
})();

// ===== Carte des incidents UKMTO =====
(function () {
  var box = document.getElementById('inc-map');
  if (!box || typeof L === 'undefined' || !window.mktIncidents) return;

  var TYPES = {
    'Attack': { label: 'Attaque', color: '#ff6b5b' },
    'Hijack': { label: 'Détournement', color: '#e8703a' },
    'Suspicious Activity': { label: 'Activité suspecte', color: '#e8b33a' },
    'Advisory': { label: 'Avis', color: '#4fd1c5' }
  };
  var OTHER = { label: 'Autre', color: '#a0aec0' };
  // Noms de navire anonymisés par l'UKMTO (NONE, MERCHANT…) : on n'affiche que le type
  function kind(t) { return TYPES[t] || OTHER; }
  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function when(iso) {
    return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  var cutoff = Date.now() - 90 * 86400000;
  var items = window.mktIncidents.filter(function (i) { return new Date(i.date) >= cutoff; });

  var map = L.map(box, { scrollWheelZoom: false }).setView([20, 50], 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 10, className: 'inc-tiles', attribution: '© OpenStreetMap'
  }).addTo(map);

  var groups = {};
  items.slice().reverse().forEach(function (i) { // les plus récents dessinés au-dessus
    var k = kind(i.type);
    var vessel = i.vessel_type;
    var marker = L.circleMarker([i.lat, i.lon], { radius: 7, color: '#fff', weight: 1.5, fillColor: k.color, fillOpacity: 0.9 })
      .bindPopup('<strong>' + k.label + ' · ' + esc(i.place) + '</strong><br>' + when(i.date) +
                 (vessel ? ' · ' + esc(vessel) : '') + '<br>' + esc(i.summary) +
                 '<br><em>Source : UKMTO n° ' + esc(String(i.number)) + '</em>');
    (groups[k.label] = groups[k.label] || { color: k.color, layer: L.layerGroup().addTo(map), n: 0 }).layer.addLayer(marker);
    groups[k.label].n++;
  });
  if (items.length) map.fitBounds(L.latLngBounds(items.map(function (i) { return [i.lat, i.lon]; })).pad(0.15));

  var filters = document.getElementById('inc-filters');
  var order = Object.keys(TYPES).map(function (t) { return TYPES[t].label; }).concat(OTHER.label);
  Object.keys(groups).sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); }).forEach(function (label) {
    var g = groups[label], b = document.createElement('button');
    b.type = 'button';
    b.className = 'inc-chip active';
    b.style.setProperty('--c', g.color);
    b.setAttribute('aria-pressed', 'true');
    b.textContent = label + ' (' + g.n + ')';
    b.addEventListener('click', function () {
      var on = b.classList.toggle('active');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (on) g.layer.addTo(map); else map.removeLayer(g.layer);
    });
    filters.appendChild(b);
  });

  // Liste courte : les 5 plus récents, résumé coupé à 2 lignes (texte complet dans la fiche de la carte)
  document.getElementById('inc-list').innerHTML = items.slice(0, 4).map(function (i) {
    var k = kind(i.type), where = [i.place, i.vessel_type].filter(Boolean).join(' · ');
    var day = new Date(i.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    return '<li style="--c:' + k.color + '"><div class="inc-meta"><time>' + day + '</time><span class="inc-tag">' + k.label +
           '</span><span class="inc-where">' + esc(where) + '</span></div><p class="inc-sum">' + esc(i.summary) + '</p></li>';
  }).join('');
})();
</script>
</body>
