<script>
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.btn-listen');

  document.querySelectorAll('.listen-dropdown.open').forEach(function (d) {
    if (!btn || d !== btn.nextElementSibling) d.classList.remove('open');
  });
  document.querySelectorAll('.btn-listen[aria-expanded="true"]').forEach(function (b) {
    if (b !== btn) b.setAttribute('aria-expanded', 'false');
  });
  document.querySelectorAll('.card.dropdown-active').forEach(function (c) {
    if (!btn || c !== btn.closest('.card')) c.classList.remove('dropdown-active');
  });

  if (btn) {
    var dropdown = btn.nextElementSibling;
    var isOpen = dropdown.classList.toggle('open');
    btn.setAttribute('aria-expanded', isOpen);
    var card = btn.closest('.card');
    if (card) card.classList.toggle('dropdown-active', isOpen);
    e.stopPropagation();
  }
});
</script>

<script data-goatcounter="https://insideenergymarkets.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <script>
// Fallback générique pour toutes les cartes AIS (Ormuz, Bab-el-Mandeb, Malacca...)
document.querySelectorAll('.ais-embed-wrap').forEach(function (wrap) {
  var frame = wrap.querySelector('.ais-frame');
  var fallback = wrap.querySelector('.ais-fallback');
  var loaded = false;
  if (frame) {
    frame.addEventListener('load', function () { loaded = true; });
    setTimeout(function () {
      if (!loaded) {
        frame.style.display = 'none';
        fallback.style.display = 'flex';
      }
    }, 12000);
  }
});

// Onglets de la page /marches/
document.querySelectorAll('.mkt-tab-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var target = btn.getAttribute('data-tab');

    document.querySelectorAll('.mkt-tab-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    btn.classList.add('active');

    document.querySelectorAll('.mkt-panel').forEach(function (panel) {
      panel.classList.remove('active');
    });
    var targetPanel = document.getElementById('panel-' + target);
    if (targetPanel) targetPanel.classList.add('active');
  });
});
</script>

<script>
var navToggle = document.querySelector('.nav-toggle');
var navLinks = document.querySelector('.nav-links');
if (navToggle) {
  navToggle.addEventListener('click', function () {
    var isOpen = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', isOpen);
  });
}
</script>
<script>
(function () {
  var chartInstances = {};

  function sliceData(arr, days) {
    if (!arr) return [];
    return arr.slice(Math.max(arr.length - days, 0));
  }

  function renderChart(key, days) {
    var dataset = window.mktChartData && window.mktChartData[key];
    if (!dataset) return;
    var canvas = document.getElementById('chart-canvas-' + key);
    if (!canvas || typeof Chart === 'undefined') return;

    var labels = sliceData(dataset.labels, days);
    var values = sliceData(dataset.values, days);

    if (chartInstances[key]) chartInstances[key].destroy();
    chartInstances[key] = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          borderColor: dataset.color,
          backgroundColor: dataset.color + '22',
          fill: true,
          tension: 0.25,
          spanGaps: true,
          pointRadius: 0,
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
        }
      }
    });
  }

  document.querySelectorAll('.mkt-flip-outer').forEach(function (card) {
    var key = card.getAttribute('data-chart');

    card.addEventListener('click', function (e) {
      if (e.target.closest('.period-btn')) return;
      card.classList.toggle('flipped');
      if (card.classList.contains('flipped') && !chartInstances[key]) {
        renderChart(key, 30);
      }
    });

    card.querySelectorAll('.period-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        card.querySelectorAll('.period-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderChart(key, parseInt(btn.getAttribute('data-period'), 10));
      });
    });
  });
})();
</script>
</body>
</html>
