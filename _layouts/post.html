---
layout: default
---
<article>
  <header class="episodes-header post-header-banner">
    <div class="wrap prose">
      <p class="eyebrow">ARTICLE</p>
      <h1>{{ page.title }}</h1>
      <p class="lead-sm">{% include date-fr.html date=page.date %}</p>
    </div>
  </header>
  {% if page.image %}
  <div class="post-hero-image">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  </div>
  {% endif %}
  <div class="post-body">
    <div class="wrap prose">
      {{ content }}
    </div>
  </div>
</article>
