---
layout: default
---
<article>
  <header class="episodes-header post-header-banner">
    <div class="wrap prose">
      <p class="eyebrow">ARTICLE</p>
      <h1>{{ page.title }}</h1>
      <p class="lead-sm">{{ page.date | date: "%d %B %Y" }}</p>
    </div>
  </header>
  <div class="post-body">
    <div class="wrap prose">
      {{ content }}
    </div>
  </div>
</article>
