---
layout: default
---
<article>
  <header class="post-header">
    <div class="wrap prose">
      <p class="date">{{ page.date | date: "%d %B %Y" }}</p>
      <h1>{{ page.title }}</h1>
    </div>
  </header>
  <div class="post-body">
    <div class="wrap prose">
      {{ content }}
    </div>
  </div>
</article>
