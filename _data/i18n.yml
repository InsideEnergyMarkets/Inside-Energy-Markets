    pending: "Prix en cours de récupération."
    how_title: "Comment est fixé le prix de demain ?"
    how:
      - "Chaque jour avant midi, producteurs, fournisseurs et traders envoient leurs offres d'achat et de vente pour le lendemain. L'enchère européenne croise toutes ces offres et publie, vers 13 h, un prix pour chaque quart d'heure de la journée suivante, zone par zone."
      - "Le prix de base est la moyenne de la journée entière. La pointe couvre les heures de 8 h à 20 h des jours ouvrés, quand la consommation est la plus forte. Quand le solaire et l'éolien produisent plus que ce que le système peut absorber, le prix peut devenir négatif : les producteurs paient alors pour injecter leur électricité."
      - "Les écarts entre la France et ses voisins reflètent les capacités d'échange aux frontières. Quand ces interconnexions sont saturées, les prix des deux côtés se séparent."
