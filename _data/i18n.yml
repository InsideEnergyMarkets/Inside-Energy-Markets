    pending: "Prices are being retrieved."
    how_title: "How is tomorrow's price set?"
    how:
      - "Every day before noon, producers, suppliers and traders submit their buy and sell orders for the next day. The European auction matches all these orders and publishes, around 1pm (Paris time), a price for every quarter-hour of the following day, zone by zone."
      - "The baseload price is the average over the whole day. Peak covers 8am to 8pm on working days, when demand is highest. When solar and wind produce more than the system can absorb, the price can turn negative: producers then pay to feed in their power."
      - "Price gaps between France and its neighbours reflect cross-border capacity. When interconnectors are congested, prices on each side split apart."
