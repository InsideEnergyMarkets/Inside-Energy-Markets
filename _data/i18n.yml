    brent:
      eyebrow: "Oil"
      title: "Brent crude oil price today"
      short: "Brent price"
      lead: "The price of a barrel of Brent, its change since the previous price and its spread with US WTI."
      compare_label: "Brent and WTI over 12 months"
      how_title: "What is Brent?"
      how:
        - "Brent is the benchmark crude oil for Europe and much of the world. It is named after a North Sea field and trades in London, on the ICE exchange, in dollars per barrel (a barrel is about 159 litres)."
        - "The price shown here is the front-month futures contract, the benchmark followed day to day. Its US counterpart is WTI, traded in New York: the spread between the two mainly reflects transport costs and each market's own balance."
        - "Brent moves with supply (OPEC+ decisions, US output, disruptions such as those in the Strait of Hormuz), demand (global growth, China), inventory levels and the dollar."
      q_price: "What is the price of a barrel of Brent today?"
      a_price: "A barrel of Brent trades at %n dollars (price on %m)."
      q_wti: "What is the difference between Brent and WTI?"
      a_wti: "They are the two main crude oil benchmarks: Brent for the North Sea and international trade, WTI for the United States. Brent is usually more expensive because it is easier to ship by sea to the large consuming regions."
      q_pump: "Does the Brent price show up at the pump?"
      a_pump: "Only partly: crude oil is just one part of the price of a litre of fuel, alongside refining, distribution and above all taxes. See the breakdown of a litre on the diesel price page."
    diesel:
      eyebrow: "Fuels"
      title: "Diesel price in France today"
      short: "Diesel price"
      lead: "Average price of a litre of diesel and SP95-E10 at French filling stations, and what it is made of: crude oil, refining and distribution, taxes."
      how_title: "Where does this price come from?"
      how:
        - "Prices come from France's public fuel price data (DGCCRF, published on data.economie.gouv.fr under the Licence Ouverte): each station reports its prices. The average covers stations that updated them over the last seven days."
        - "The crude oil share is calculated from the Brent price, converted to euros and per litre. Taxes are the TICPE, a fixed amount per litre, and 20% VAT applied to the whole. The rest covers refining, transport, distribution and margins."
      q_price: "What is the average diesel price today?"
      a_price: "A litre of diesel costs €%n on average in France, and SP95-E10 €%m (station average, DGCCRF data)."
      q_taxes: "How much tax is in a litre of diesel?"
      a_taxes: "Taxes (TICPE and VAT) account for about %n% of the price of a litre of diesel today."
      q_lag: "Why does diesel not fall as much as crude oil?"
      a_lag: "Because the TICPE is a fixed amount per litre: it does not fall when oil does. The diesel price also depends on refining margins, which have their own market, and it follows crude with a lag of a few days."
    storage:
      eyebrow: "Gas"
      title: "European gas storage today"
      short: "Gas storage"
      lead: "How full gas storage is in the European Union and in France, compared with the same date last year."
      how_title: "Why follow gas storage?"
      how:
        - "Europe uses far more gas in winter than in summer. Storage is filled from April to October, when demand is low, then drawn down over the winter. Its level going into winter is a key indicator of security of supply and weighs on prices."
        - "The European Union sets a filling target before winter (90% in the 2022 regulation, with more flexibility added in 2025). The data come from GIE AGSI+, the platform where European storage operators report their levels."
      q_level: "How full is gas storage in Europe?"
      a_level: "EU gas storage is %n% full, %m."
      vs_ly_above: "%n points above last year on the same date"
      vs_ly_below: "%n points below last year on the same date"
      q_france: "How much gas does France have in storage?"
      a_france: "French storage is %n% full, about %m TWh of gas."
      q_why: "What happens if storage is low?"
      a_why: "Low storage going into winter means importing more, mostly LNG, when demand peaks: prices rise and the risk of shortages increases if the winter is cold."
