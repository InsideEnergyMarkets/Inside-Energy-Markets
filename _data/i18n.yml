    brent:
      eyebrow: "Pétrole"
      title: "Prix du baril de Brent aujourd'hui"
      short: "Prix du Brent"
      lead: "Le cours du baril de Brent, sa variation par rapport au cours précédent et son écart avec le WTI américain."
      compare_label: "Brent et WTI sur 12 mois"
      how_title: "Le Brent, c'est quoi ?"
      how:
        - "Le Brent est le pétrole brut de référence en Europe et dans une grande partie du monde. Il tire son nom d'un gisement de la mer du Nord et se négocie à Londres, sur le marché ICE, en dollars par baril (un baril fait environ 159 litres)."
        - "Le prix affiché ici est celui du contrat à terme le plus proche, la référence suivie au quotidien. Son équivalent américain est le WTI, coté à New York : l'écart entre les deux reflète surtout les coûts de transport et l'équilibre propre à chaque marché."
        - "Le Brent bouge avec l'offre (décisions de l'OPEP+, production américaine, perturbations comme celles du détroit d'Ormuz), la demande (croissance mondiale, Chine), le niveau des stocks et le dollar."
      q_price: "Quel est le prix du baril de Brent aujourd'hui ?"
      a_price: "Le baril de Brent cote %n dollars (cours du %m)."
      q_wti: "Quelle différence entre le Brent et le WTI ?"
      a_wti: "Ce sont les deux grandes références du pétrole brut : le Brent pour la mer du Nord et le marché international, le WTI pour les États-Unis. Le Brent est en général plus cher, car il se transporte plus facilement par la mer vers les grands consommateurs."
      q_pump: "Le prix du Brent se retrouve-t-il à la pompe ?"
      a_pump: "En partie seulement : le pétrole brut ne représente qu'une part du prix d'un litre de carburant, à côté du raffinage, de la distribution et surtout des taxes. Voir la décomposition du litre sur la page du prix du gazole."
    diesel:
      eyebrow: "Carburants"
      title: "Prix du gazole aujourd'hui en France"
      short: "Prix du gazole"
      lead: "Prix moyen du litre de gazole et de SP95-E10 dans les stations françaises, et ce qui le compose : pétrole, raffinage et distribution, taxes."
      how_title: "D'où vient ce prix ?"
      how:
        - "Les prix proviennent des données publiques des carburants (DGCCRF, publiées sur data.economie.gouv.fr sous Licence Ouverte) : chaque station déclare ses prix. La moyenne porte sur les stations qui les ont mis à jour au cours des sept derniers jours."
        - "La part du pétrole brut est calculée à partir du cours du Brent, converti en euros et ramené au litre. Les taxes sont la TICPE, un montant fixe par litre, et la TVA à 20 %, appliquée sur l'ensemble. Le reste couvre le raffinage, le transport, la distribution et les marges."
      q_price: "Quel est le prix moyen du gazole aujourd'hui ?"
      a_price: "Le litre de gazole coûte en moyenne %n € en France, et le SP95-E10 %m € (moyenne des stations, données DGCCRF)."
      q_taxes: "Quelle part de taxes dans un litre de gazole ?"
      a_taxes: "Les taxes (TICPE et TVA) représentent environ %n % du prix d'un litre de gazole aujourd'hui."
      q_lag: "Pourquoi le gazole ne baisse-t-il pas autant que le pétrole ?"
      a_lag: "Parce que la TICPE est un montant fixe par litre : elle ne baisse pas quand le pétrole baisse. Le prix du gazole dépend aussi des marges de raffinage, qui ont leur propre marché, et il suit le brut avec quelques jours de décalage."
    storage:
      eyebrow: "Gaz"
      title: "Stocks de gaz en Europe aujourd'hui"
      short: "Stocks de gaz"
      lead: "Taux de remplissage des stockages de gaz de l'Union européenne et de la France, comparé à la même date l'an dernier."
      how_title: "Pourquoi suivre les stocks de gaz ?"
      how:
        - "L'Europe consomme beaucoup plus de gaz en hiver qu'en été. Les stockages se remplissent d'avril à octobre, quand la demande est faible, puis se vident pendant l'hiver. Leur niveau à l'entrée de l'hiver est un indicateur clé de la sécurité d'approvisionnement et pèse sur les prix."
        - "L'Union européenne fixe un objectif de remplissage avant l'hiver (90 % dans le règlement de 2022, avec des marges de manœuvre ajoutées en 2025). Les données viennent de GIE AGSI+, la plateforme où les opérateurs de stockage européens déclarent leurs niveaux."
      q_level: "Quel est le niveau des stocks de gaz en Europe ?"
      a_level: "Les stockages de l'Union européenne sont remplis à %n %, soit %m."
      vs_ly_above: "%n points au-dessus de l'an dernier à la même date"
      vs_ly_below: "%n points en dessous de l'an dernier à la même date"
      q_france: "Combien de gaz la France a-t-elle en stock ?"
      a_france: "Les stockages français sont remplis à %n %, soit environ %m TWh de gaz."
      q_why: "Que se passe-t-il si les stocks sont bas ?"
      a_why: "Des stocks bas à l'entrée de l'hiver obligent à importer davantage, surtout du GNL, au moment où la demande est la plus forte : les prix montent et le risque de tension augmente en cas d'hiver froid."
