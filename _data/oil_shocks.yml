# Frise « Chocs géopolitiques et prix du pétrole » (/marches/#chocs). Liste tenue à la main (validée par Tom) :
# les grands chocs de l'histoire, puis les événements récents (depuis 2022, frise à l'échelle).
# Les chiffres sont calculés par scripts/fetch_market_data.py (update_oil_shocks) dans _data/oil_shocks_data.json :
# Brent quotidien (EIA via FRED) depuis 1987 ; avant 1987, WTI mensuel (FRED, WTISPLC), signalé comme tel.
# type : geo (choc géopolitique) ou eco (choc économique ou décision de l'OPEP).
# Retiré (24/10/2026) : déblocage de stocks du G7 du 02/10/2026. Le Brent Dated a bondi de 18 % le même jour
# (tension physique liée à Ormuz) alors que les contrats à terme ont reculé : chiffre trompeur pour cet événement.
- id: embargo-1973
