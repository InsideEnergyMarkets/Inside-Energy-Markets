  type: geo
  fr: "Premier choc pétrolier"
  en: "First oil shock"
  desc_fr: "Pendant la guerre du Kippour, les pays arabes producteurs (OPAEP) réduisent leur production puis décrètent un embargo contre plusieurs pays occidentaux."
  desc_en: "During the Yom Kippur War, Arab producers (OAPEC) cut output and then impose an embargo on several Western countries."
