---
layout: default
title: Épisodes
permalink: /episodes/
---

<section class="block">
  <div class="wrap">
    <div class="section-head">
      <h2>Tous les épisodes</h2>
    </div>
    <div class="card-grid">
      {% for ep in site.data.episodes %}
      <div class="card">
        <p class="num">Épisode {{ ep.number }}</p>
        <h3>{{ ep.title }}</h3>
        <p>{{ ep.description }}</p>
<div class="listen-links">
  <a class="spotify" href="{{ ep.spotify }}" target="_blank" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
  <a class="apple" href="{{ ep.apple }}" target="_blank" aria-label="Apple Podcasts"><i class="fa-solid fa-podcast"></i></a>
  <a class="linkedin" href="https://www.linkedin.com/in/tom-moulard/" target="_blank" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
