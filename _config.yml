title: Inside Energy Markets
description: "Comprendre les marchés de l'énergie : podcast, analyses et données de marché par Tom Moulard."
author: Tom Moulard
url: "https://insideenergymarkets.com"
baseurl: ""

markdown: kramdown
permalink: /blog/:title/

collections:
  episodes:
    output: false
  # Notes de marché hebdomadaires (scripts/generate_note.py), adresse dans le front matter
  notes:
    output: true

lang: fr
locale: fr_FR

# Deux langues : le français à la racine, l'anglais sous /en/ (mêmes gabarits, textes dans
# _data/i18n.yml). `ref` relie une page ou un article à sa traduction (sélecteur FR | EN).
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: fr
  - scope:
      path: ""
    values:
      layout: default
      lang: fr
  - scope:
      path: "en"
      type: posts
    values:
      layout: post
      lang: en
      locale: en_GB
      permalink: /en/blog/:title/
  - scope:
      path: "en"
    values:
      layout: default
      lang: en
      locale: en_GB
  # Fichier de vérification de la Search Console : pas une page à référencer
  - scope:
      path: "google2488f4d4c023d3e9.html"
    values:
      sitemap: false
  # Clé IndexNow (signaler les nouvelles pages à Bing) : pas une page à référencer
  - scope:
      path: "ba5fdc11ee8578d5540c332e9933f73f.txt"
    values:
      sitemap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

logo: /assets/img/hero.png
twitter:
  card: summary_large_image

# Mois de lancement du podcast (page À propos), prioritaire sur la date du premier épisode du flux
podcast_start: "2026-02-01"
