title: Inside Energy Markets
description: "Comprendre les marchés de l'énergie — podcast et analyses par Tom Moulard."
author: Tom Moulard
url: "https://insideenergymarkets.github.io"
baseurl: "/Inside-Energy-Markets"

markdown: kramdown
permalink: /blog/:title/

collections:
  episodes:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  
plugins:
  - jekyll-seo-tag

logo: /assets/img/hero.png
twitter:
  card: summary_large_image
